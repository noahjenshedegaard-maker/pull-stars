<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pullstar Anniversary Pack — 3D Model</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
:root{--bg:#0B1222;--bg2:#16244A;--fg:#F4F1EA;--muted:#B9C0D0;--pop:#FFC93C;--btn:#1E2D50;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#E9ECF3;--bg2:#C9D2E6;--fg:#14213D;--muted:#3D4A66;--btn:#FFFFFF}}
:root[data-theme="dark"]{--bg:#0B1222;--bg2:#16244A;--fg:#F4F1EA;--muted:#B9C0D0;--btn:#1E2D50}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 40%,var(--bg2),var(--bg) 70%);background-color:var(--bg);color:var(--fg);font-family:'Bricolage Grotesque','Helvetica Neue',sans-serif;overflow:hidden;display:flex;flex-direction:column}
header{padding:16px 20px 0;display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.3px}
.hint{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted)}
#stage{flex:1;min-height:0;position:relative;touch-action:none;cursor:grab}
#stage:active{cursor:grabbing}
canvas{display:block;width:100%;height:100%}
.bar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:12px 16px 18px}
.tray{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:0 16px}
.tray img{height:76px;border-radius:5px;box-shadow:0 4px 12px rgba(0,0,0,.4);animation:pop .35s ease-out}
@keyframes pop{from{transform:translateY(20px) scale(.6);opacity:0}to{transform:none;opacity:1}}
button{font:700 15px 'Bricolage Grotesque',sans-serif;min-height:44px;padding:0 18px;border-radius:999px;border:1.5px solid var(--muted);background:var(--btn);color:var(--fg);cursor:pointer}
button.primary{background:var(--pop);color:#14213D;border-color:var(--pop)}
button:focus-visible{outline:3px solid var(--pop);outline-offset:2px}
</style>
</head>
<body>
<header><h1>Pullstar anniversary pack · 3D</h1><span class="hint" id="hint" aria-live="polite">Drag the yellow PULL tab to the right to tear it open</span></header>
<div id="stage" aria-label="Interactive 3D model of the card pack"></div>
<div id="tray" class="tray" aria-label="Cards you have pulled"></div>
<div class="bar">
<button id="bFront">Front</button>
<button id="bBack">Back</button>
<button id="bPull" class="primary">Pull the tab</button>
<button id="bReset">Reset</button>
</div>

 c.font="600 17px 'IBM Plex Mono',monospace";c.textAlign='center';c.fillText('MARKET PRICE',qx+qs/2,qy+qs+12);c.font="700 20px 'Bricolage Grotesque',sans-serif";c.fillText('on Collectr',qx+qs/2,qy+qs+36);
 c.fillStyle='#DDE3EE';c.font="600 22px 'IBM Plex Mono',monospace";c.fillText('5 CARDS  ·  NO-BEND BACKER  ·  CLEAN-TEAR TAB',400,1240);c.textAlign='left';
 crimp(c,0,100);crimp(c,1300,100);strip(c,'PULL TAB  →');

function backTex(){const cv=document.createElement('canvas');cv.width=800;cv.height=1400;const c=cv.getContext('2d');seed=11;
 const g=c.createLinearGradient(800,0,0,1400);g.addColorStop(0,'#1B2B57');g.addColorStop(1,'#0E1730');c.fillStyle=g;c.fillRect(0,0,800,1400);
 for(let i=0;i<5;i++)bolt(c,rnd()*800,240,rnd()*800,1280,9,90,2,'rgba(159,216,255,.18)');
 c.fillStyle=POP;c.font="800 64px 'Bricolage Grotesque',sans-serif";c.fillText('How to open',56,330);
 const steps=[['1','Hold the pack upright.'],['2','Grab the yellow tab at the top right.'],['3','Pull it across — it tears clean above the cards.'],['4','Slide the cards out by their edges.']];
 steps.forEach((s,i)=>{const y=420+i*92;c.fillStyle=POP;c.beginPath();c.arc(84,y-12,28,0,Math.PI*2);c.fill();c.fillStyle=NAVY;c.font="800 30px 'Bricolage Grotesque',sans-serif";c.textAlign='center';c.fillText(s[0],84,y-1);c.textAlign='left';c.fillStyle=CREAM;c.font="500 30px 'Bricolage Grotesque',sans-serif";c.fillText(s[1],132,y);});
 c.strokeStyle='rgba(244,241,234,.35)';c.lineWidth=2;rr(c,56,830,688,220,20);c.stroke();
 c.fillStyle=CREAM;c.font="600 24px 'IBM Plex Mono',monospace";['CARDS  5 PER PACK','SET    [SET]','COND.  [NM / LP]'].forEach((t,i)=>c.fillText(t,88,894+i*58));
 c.fillStyle=POP;c.font="700 34px 'Bricolage Grotesque',sans-serif";c.fillText('Scan the QR on the front',56,1120);c.fillStyle=CREAM;c.font="500 28px 'Bricolage Grotesque',sans-serif";c.fillText("for today's market price on Collectr.",56,1162);
 c.fillStyle=CREAM;rr(c,520,1196,224,84,10);c.fill();c.fillStyle=NAVY;for(let x=536;x<728;){const w=2+Math.floor(rnd()*5);c.fillRect(x,1206,w,52);x+=w+2+Math.floor(rnd()*4);}c.font="600 14px 'IBM Plex Mono',monospace";c.fillText('[BARCODE]',586,1274);
 logo(c,48,1214,1.1);
 crimp(c,0,100);crimp(c,1300,100);strip(c,'← TEAR STRIP');return cv;}

function tabTex(){const cv=document.createElement('canvas');cv.width=280;cv.height=160;const c=cv.getContext('2d');c.fillStyle=POP;c.beginPath();c.moveTo(0,0);c.lineTo(220,0);c.lineTo(280,80);c.lineTo(220,160);c.lineTo(0,160);c.fill();c.fillStyle=NAVY;c.font="800 54px 'Bricolage Grotesque',sans-serif";c.textBaseline='middle';c.fillText('PULL',40,84);return cv;}

function cardTex(front,i){const CG=[['#FFE58A','#FF9A3C'],['#B8FFF4','#3EE6D0'],['#C9D6FF','#5AA9FF'],['#FFD2B8','#FF6B5A'],['#E5D4FF','#A66BFF'],['#F4F1EA','#F4F1EA']][i||0];const cv=document.createElement('canvas');cv.width=630;cv.height=880;const c=cv.getContext('2d');
 if(front&&CARDIMG[i||0].complete){c.drawImage(CARDIMG[i||0],0,0,630,880);}
 else if(front){const g=c.createLinearGradient(0,0,630,880);g.addColorStop(0,CG[0]);g.addColorStop(1,CG[1]);c.fillStyle=g;c.fillRect(0,0,630,880);c.fillStyle='#FFF8E5';rr(c,30,30,570,820,24);c.fill();c.fillStyle='#E7ECF5';rr(c,60,120,510,360,12);c.fill();c.fillStyle=NAVY;c.font="800 44px 'Bricolage Grotesque',sans-serif";c.fillText('[CARD '+((i||0)+1)+']',64,96);c.font="600 24px 'IBM Plex Mono',monospace";c.fillStyle='#3D4A66';c.textAlign='center';c.fillText('card art',315,310);c.fillText('63 × 88 mm',315,640);c.textAlign='left';}
 else{c.fillStyle='#1E2D50';c.fillRect(0,0,630,880);c.strokeStyle=POP;c.lineWidth=14;rr(c,30,30,570,820,24);c.stroke();}
 return cv;}

const stage=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputEncoding=THREE.sRGBEncoding;stage.appendChild(renderer.domElement);
const scene=new THREE.Scene();const cam=new THREE.PerspectiveCamera(32,1,1,2000);cam.position.set(0,0,300);
scene.add(new THREE.HemisphereLight(0xffffff,0x334466,.85));const key=new THREE.DirectionalLight(0xffffff,.9);key.position.set(80,120,200);scene.add(key);const rim=new THREE.DirectionalLight(0x9fd8ff,.5);rim.position.set(-150,-50,-150);scene.add(rim);
const pack=new THREE.Group();scene.add(pack);const cap=new THREE.Group();pack.add(cap);

function puff(x,y){const ay=Math.abs(y);let fy=Math.min(1,Math.max(0,(60-ay)/9));fy=fy*fy*(3-2*fy);const fx=1-Math.pow(Math.abs(x)/(W/2),6);return 4.4*fx*fy;}
function tex(cv){const t=new THREE.CanvasTexture(cv);t.encoding=THREE.sRGBEncoding;t.anisotropy=renderer.capabilities.getMaxAnisotropy();return t;}
function panel(y0,y1,back,t){const h=y1-y0,g=new THREE.PlaneGeometry(W,h,48,Math.max(2,Math.round(h)));g.translate(0,(y0+y1)/2,0);const p=g.attributes.position,uv=g.attributes.uv;
 for(let i=0;i<p.count;i++){const x=p.getX(i),y=p.getY(i);uv.setXY(i,(x+W/2)/W,(y+H/2)/H);p.setZ(i,puff(x,y));}
 if(back)g.rotateY(Math.PI);g.computeVertexNormals();
 return new THREE.Mesh(g,new THREE.MeshStandardMaterial({map:t,metalness:.35,roughness:.32,side:THREE.DoubleSide}));}

let card,tab,cards=[];let HOLO;
function holoTex(){const cv=document.createElement('canvas');cv.width=512;cv.height=512;const c=cv.getContext('2d');const g=c.createLinearGradient(0,0,512,512);['#ff4d6d','#000000','#ffd93d','#000000','#6bff95','#000000','#4dd2ff','#000000','#a66bff','#000000','#ff4d6d'].forEach((col,i,a)=>g.addColorStop(i/(a.length-1),col));c.fillStyle=g;c.fillRect(0,0,512,512);
 const t=new THREE.CanvasTexture(cv);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(1.2,1.2);return t;}
function build(){HOLO=holoTex();const ft=tex(frontTex()),bt=tex(backTex());
 pack.add(panel(-H/2,TEAR,false,ft));pack.add(panel(-H/2,TEAR,true,bt));cap.add(panel(TEAR,H/2,false,ft));cap.add(panel(TEAR,H/2,true,bt));
 tab=new THREE.Mesh(new THREE.PlaneGeometry(14,8),new THREE.MeshStandardMaterial({map:tex(tabTex()),transparent:true,side:THREE.DoubleSide,roughness:.5}));tab.position.set(W/2+7,TEAR+1,0);cap.add(tab);
 card=new THREE.Group();
 const backTexC=tex(cardTex(false,0));cards=[];
 for(let i=0;i<5;i++){const cg=new THREE.Group();const cf=new THREE.Mesh(new THREE.PlaneGeometry(63,88),new THREE.MeshStandardMaterial({map:tex(cardTex(true,i)),roughness:.4}));cf.position.z=.02;cg.add(cf);if(i===2||i===4){const hm=new THREE.Mesh(new THREE.PlaneGeometry(63,88),new THREE.MeshBasicMaterial({map:HOLO,transparent:true,opacity:.14,blending:THREE.AdditiveBlending,depthWrite:false}));hm.position.z=.05;cg.add(hm);}
  const cb=new THREE.Mesh(new THREE.PlaneGeometry(63,88),new THREE.MeshStandardMaterial({map:backTexC,roughness:.4}));cb.rotation.y=Math.PI;cg.add(cb);
  cg.userData.isCard=true;cg.position.z=-0.8+(4-i)*0.38;cg.userData.z=cg.position.z;card.add(cg);cards.push(cg);}
 {const ag=new THREE.Group();const box=new THREE.Mesh(new THREE.BoxGeometry(63,88,.5),new THREE.MeshStandardMaterial({color:0xF4F1EA,roughness:.9}));ag.add(box);
  const af=new THREE.Mesh(new THREE.PlaneGeometry(63,88),new THREE.MeshStandardMaterial({map:tex(cardTex(true,5)),roughness:.5}));af.position.z=.26;ag.add(af);
  ag.userData.isCard=true;ag.position.z=-1.3;ag.userData.z=-1.3;card.add(ag);cards.push(ag);}
 card.position.set(0,-12,0);pack.add(card);}

const NAMES=['Sparklet','Frillo','Embowl','Mothleaf','Nebbly','Pullstar ad'];
let rotX=-.12,rotY=-.5,tX=rotX,tY=rotY,auto=true,zoom=300;
let pullT=0,pullDir=0,tabDrag=null,opened=false,peek=0,nextIdx=0,cardDrag=null,revealed=null,leaving=[];
const hintEl=document.getElementById('hint'),tray=document.getElementById('tray');
const START='Drag the yellow PULL tab to the right to tear it open';
function hint(t){hintEl.textContent=t;}
function resize(){const w=stage.clientWidth,h=stage.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();zoom=Math.max(zoom,w<500?380:260);}
addEventListener('resize',resize);try{new ResizeObserver(resize).observe(stage);}catch(e){}
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
function hit(e){const r=renderer.domElement.getBoundingClientRect();ndc.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(ndc,cam);return ray.intersectObjects([pack],true)[0];}
function wpp(){return 2*cam.position.z*Math.tan(cam.fov*Math.PI/360)/stage.clientHeight;}
function inCap(o){while(o){if(o===cap)return true;o=o.parent;}return false;}
function face(a){auto=false;tX=-.05;tY=Math.round((tY-a)/(Math.PI*2))*Math.PI*2+a;}
function reveal(cg){scene.attach(cg);cg.userData.from={p:cg.position.clone(),q:cg.quaternion.clone()};cg.userData.t=0;revealed=cg;nextIdx++;hint('Nice pull! Tap the card to keep it');}
function keep(){const cg=revealed;revealed=null;cg.userData.leave=true;leaving.push(cg);const i=cards.indexOf(cg);const im=document.createElement('img');im.src=CARDIMG[i].src;im.alt=NAMES[i]+' card';tray.appendChild(im);
 hint(nextIdx<5?'Drag the next card up to pull it out':nextIdx<6?'One more: pull the ad card out too':'Pack empty! Hit Reset to open another');}
let drag=null;
stage.addEventListener('pointerdown',e=>{stage.setPointerCapture(e.pointerId);auto=false;
 if(revealed){if(revealed.userData.t>=1)keep();return;}
 const h=hit(e);
 if(h&&pullT<1&&inCap(h.object)){tabDrag={x:e.clientX,t0:pullT};pullDir=0;return;}
 if(h&&opened&&peek>.95&&nextIdx<6){let o=h.object;while(o&&!o.userData.isCard)o=o.parent;if(o){const cg=cards[nextIdx];cg.userData.snap=null;cardDrag={y:e.clientY,cg,y0:0};return;}}
 drag={x:e.clientX,y:e.clientY};});
stage.addEventListener('pointermove',e=>{
 if(tabDrag){pullT=Math.max(0,Math.min(1,tabDrag.t0+(e.clientX-tabDrag.x)*wpp()/55));return;}
 if(cardDrag){cardDrag.cg.position.y=Math.max(0,(cardDrag.y-e.clientY)*wpp());if(cardDrag.cg.position.y>40){const cg=cardDrag.cg;cardDrag=null;reveal(cg);}return;}
 if(!drag)return;tY+=(e.clientX-drag.x)*.01;tX=Math.max(-1.2,Math.min(1.2,tX+(e.clientY-drag.y)*.01));drag={x:e.clientX,y:e.clientY};});
function up(){if(tabDrag){pullDir=pullT>.3?1:-1;tabDrag=null;}if(cardDrag){cardDrag.cg.userData.snap=0;cardDrag=null;}drag=null;}
stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);
stage.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(160,Math.min(600,zoom+e.deltaY*.3));},{passive:false});
let pinch=0;stage.addEventListener('touchmove',e=>{if(e.touches.length===2){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(pinch)zoom=Math.max(160,Math.min(600,zoom-(d-pinch)*.8));pinch=d;}},{passive:true});stage.addEventListener('touchend',()=>pinch=0);
document.getElementById('bFront').onclick=()=>face(0);document.getElementById('bBack').onclick=()=>face(Math.PI);
document.getElementById('bPull').onclick=()=>{face(0);pullDir=1;};
document.getElementById('bReset').onclick=()=>{pullDir=-1;opened=false;nextIdx=0;revealed=null;leaving=[];cardDrag=null;tray.innerHTML='';
 cards.forEach(cg=>{card.add(cg);cg.position.set(0,0,cg.userData.z);cg.rotation.set(0,0,0);cg.scale.set(1,1,1);cg.userData.t=undefined;cg.userData.leave=false;cg.userData.snap=null;cg.visible=true;});
 hint(START);face(-.5);auto=true;};
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const QID=new THREE.Quaternion(),TARGET=new THREE.Vector3(0,0,70);
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;
 if(auto)tY+=dt*.35;rotX+=(tX-rotX)*.12;rotY+=(tY-rotY)*.12;pack.rotation.set(rotX,rotY,0);
 if(pullDir&&!tabDrag){pullT=Math.max(0,Math.min(1,pullT+pullDir*dt/1.1));if(pullT===0||pullT===1)pullDir=0;}
 if(pullT>=1&&!tabDrag&&!opened){opened=true;face(0);hint('Drag the top card up to pull it out');}
 peek=Math.max(0,Math.min(1,peek+(opened?1:-1)*dt/.6));
 const a=ease(pullT);cap.position.set(a*70,a*18,a*6);cap.rotation.set(0,a*-.5,a*-.35);cap.visible=a<.999||true;
 if(card)card.position.y=-12+ease(peek)*30;
 cards.forEach(cg=>{if(cg.userData.snap!=null&&cg.parent===card){cg.position.y+=(cg.userData.snap-cg.position.y)*.25;if(Math.abs(cg.position.y)<.05){cg.position.y=0;cg.userData.snap=null;}}});
 if(revealed&&revealed.userData.t<1){const u=revealed.userData;u.t=Math.min(1,u.t+dt/.9);const e=ease(u.t);revealed.position.lerpVectors(u.from.p,TARGET,e);revealed.quaternion.copy(u.from.q).slerp(QID,e);revealed.rotateY((1-e)*Math.PI*2);const s=1+.15*e;revealed.scale.set(s,s,s);}
 leaving.forEach(cg=>{cg.position.y-=dt*320;cg.rotation.z+=dt*1.5;if(cg.position.y<-300)cg.visible=false;});
 if(HOLO){HOLO.offset.x=rotY*.4+now*.00006;HOLO.offset.y=rotX*.4;}
 cam.position.z+=(zoom-cam.position.z)*.15;renderer.render(scene,cam);requestAnimationFrame(loop);}
(async()=>{try{await ART.decode();}catch(e){}try{await Promise.all(CARDIMG.map(im=>im.decode()));}catch(e){}try{await Promise.race([Promise.all([document.fonts.load("800 100px 'Bricolage Grotesque'"),document.fonts.load("500 30px 'Bricolage Grotesque'"),document.fonts.load("600 24px 'IBM Plex Mono'")]),new Promise(r=>setTimeout(r,2500))]);}catch(e){}
 build();resize();requestAnimationFrame(loop);})();
